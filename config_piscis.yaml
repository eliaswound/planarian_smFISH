# config_piscis.yaml
# Configuration file for Piscis spot detection

# Input image path
image_path: "/scratch/qgs8612/Experiment/12hr_Amputation/Image1/565/12hr_Amputation_Image1_565.tif"

# Output directory (will be created if it doesn't exist)
output_dir: "/scratch/qgs8612/piscis_test/"

# Piscis model settings
# Set to null/None to use the default built-in model from Hugging Face
# Or specify a custom model name/path
model_name: null  # Use default built-in model

# Batch size for processing (useful for large images)
batch_size: 1

# Device to use: 'cpu', 'gpu', or 'tpu'
# Changed to GPU for JAX acceleration
# Note: For GPU, you need JAX with GPU support installed
device: "gpu"

# Spot plotting settings (same as config.yaml)
plot_spot_size: 4
plotInnerCircle: false
plotSpotLabel: false

